name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    name: Linux tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config libfontconfig1-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Tests
        run: cargo test --workspace --exclude musico_playback
        # Engine e2e needs a real audio device; the InnerTube live test is
        #[ignore]-gated behind MUSICO_LIVE_TESTS.
